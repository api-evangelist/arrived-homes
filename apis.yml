name: Arrived Homes
description: 'Arrived (Arrived Homes) is an SEC-qualified real estate investing platform
  that lets anyone buy fractional shares of income-producing single-family rental
  homes and vacation rentals for as little as $100. Arrived curates and acquires
  properties nationwide, handles acquisition, financing, property management, tenant
  placement, maintenance, and financial reporting, and passes rental income to
  investors as quarterly dividends alongside long-term appreciation. The platform
  also offers pooled funds including a Single Family Residential Fund and a Real
  Estate Income (debt) Fund. As of profiling it reports roughly 981K registered
  investors, $445M invested, and $95M distributed. Backed by Forerunner Ventures,
  it operates as a consumer fintech / proptech product with a web and mobile app;
  it publishes no public developer API. This API Evangelist profile is enriched
  from public company surfaces.'
